# Workflow автоматической публикации статического сайта на GitHub Pages.
name: Deploy static site # название workflow (видно на вкладке Actions)

# Триггер: workflow запускается при каждом push в ветку main
on:
  push:
    branches: [ main ]

# Права доступа, необходимые для публикации на GitHub Pages
permissions:
  contents: read # чтение файлов репозитория
  pages: write # разрешение на публикацию в Pages
  id-token: write # OIDC-токен для подтверждения деплоя

jobs:
  lint: # задание 1: проверить HTML и CSS перед деплоем
    runs-on: ubuntu-latest
    steps:
      # Шаг 1. Скопировать файлы репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Установить Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Шаг 3. Установить линтеры (HTMLHint, Stylelint)
      - name: Install dependencies
        run: npm install

      # Шаг 4. Проверить HTML и CSS (при ошибке workflow остановится)
      - name: Lint HTML and CSS
        run: npm run lint

  deploy: # задание 2: собрать и опубликовать сайт
    needs: lint # запускается только если lint прошёл успешно
    runs-on: ubuntu-latest # виртуальная машина-исполнитель
    environment:
      name: github-pages
      # ссылка на опубликованный сайт появится в сводке запуска
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Шаг 1. Скопировать файлы репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Подготовить окружение GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Шаг 3. Упаковать файлы сайта в артефакт (path: '.' = весь проект)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Шаг 4. Опубликовать артефакт на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
